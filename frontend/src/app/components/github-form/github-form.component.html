<div class="card">
  <div class="card-header">
    <div class="header-left">
      <lucide-angular [img]="GithubIcon" [size]="16"></lucide-angular>
      <span>Connexion & Périmètre</span>
    </div>
  </div>

  <div class="card-body">
    <div class="form-grid">
      <div class="form-group">
        <label class="required-label">
          Nom d'utilisateur GitHub *
          <div class="info-tooltip">
            <lucide-angular [img]="InfoIcon" [size]="12"></lucide-angular>
            <span class="tooltip-text">Nom d'utilisateur du propriétaire du dépôt GitHub (ex: octocat)</span>
          </div>
        </label>
        <div class="input-wrap">
          <lucide-angular class="input-icon" [img]="UserIcon" [size]="16"></lucide-angular>
          <input
            type="text"
            placeholder="janedoe"
            [(ngModel)]="form.username"
            name="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="required-label">
          Dépôt *
          <div class="info-tooltip">
            <lucide-angular [img]="InfoIcon" [size]="12"></lucide-angular>
            <span class="tooltip-text">Nom du dépôt GitHub sans le nom d'utilisateur (ex: hello-world)</span>
          </div>
        </label>
        <div class="input-wrap">
          <input
            type="text"
            placeholder="my-saas-app"
            [(ngModel)]="form.repo"
            name="repo"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="required-label">
          Période *
          <div class="info-tooltip">
            <lucide-angular [img]="InfoIcon" [size]="12"></lucide-angular>
            <span class="tooltip-text">Période de temps pour analyser les commits (défaut: 7 jours)</span>
          </div>
        </label>
        <div class="input-wrap">
          <lucide-angular class="input-icon" [img]="CalendarIcon" [size]="16"></lucide-angular>
          <select [(ngModel)]="form.range" name="range" required>
            <option>Dernier jour</option>
            <option>7 Derniers jours</option>
            <option>30 Derniers jours</option>
            <option>3 Derniers mois</option>
            <option>Dernière année</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>
          Auteur <span class="optional">(optionnel)</span>
          <div class="info-tooltip">
            <lucide-angular [img]="InfoIcon" [size]="12"></lucide-angular>
            <span class="tooltip-text">Filtrer les commits par nom d'auteur spécifique</span>
          </div>
        </label>
        <div class="input-wrap">
          <lucide-angular class="input-icon" [img]="UserIcon" [size]="16"></lucide-angular>
          <input
            type="text"
            placeholder="Filtrer par auteur"
            [(ngModel)]="form.author"
            name="author"
          />
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="token-group">
        <label>
          Token d'accès personnel
          <div class="info-tooltip">
            <lucide-angular [img]="InfoIcon" [size]="12"></lucide-angular>
            <span class="tooltip-text">Token GitHub pour accéder aux dépôts privés </span>
          </div>
        </label>
        <div class="input-wrap">
          <lucide-angular class="input-icon" [img]="KeyIcon" [size]="16"></lucide-angular>
          <input
            type="password"
            placeholder="ghp_xxxxxxxxxxxx"
            [(ngModel)]="form.token"
            name="token"
          />
        </div>
        
      </div>

      <div class="actions">
        <button class="fetch-btn" (click)="onFetchCommits()">
          <lucide-angular [img]="GithubIcon" [size]="16"></lucide-angular>
          <span>Récupérer les commits</span>
        </button>
      </div>
    </div>
  </div>
</div>
