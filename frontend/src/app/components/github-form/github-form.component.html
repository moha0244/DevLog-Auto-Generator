<div class="card">
  <div class="card-header">
    <div class="header-left">
      <lucide-angular [img]="GithubIcon" [size]="16"></lucide-angular>
      <span>Connexion & Périmètre</span>
    </div>
  </div>

  <div class="card-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Nom d'utilisateur GitHub</label>
        <div class="input-wrap">
          <lucide-angular class="input-icon" [img]="UserIcon" [size]="16"></lucide-angular>
          <input
            type="text"
            placeholder="janedoe"
            [(ngModel)]="form.username"
            name="username"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Dépôt</label>
        <div class="input-wrap">
          <input
            type="text"
            placeholder="my-saas-app"
            [(ngModel)]="form.repo"
            name="repo"
          />
        </div>
      </div>

      <div class="form-group">
        <label>Période</label>
        <div class="input-wrap">
          <lucide-angular class="input-icon" [img]="CalendarIcon" [size]="16"></lucide-angular>
          <select [(ngModel)]="form.range" name="range">
            <option>Dernier jour</option>
            <option>7 Derniers jours</option>
            <option>30 Derniers jours</option>
            <option>3 Derniers mois</option>
            <option>Dernière année</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Auteur <span class="optional">(optionnel)</span></label>
        <div class="input-wrap">
          <lucide-angular class="input-icon" [img]="UserIcon" [size]="16"></lucide-angular>
          <input
            type="text"
            placeholder="Filtrer par auteur"
            [(ngModel)]="form.author"
            name="author"
          />
        </div>
      </div>
    </div>

    <div class="bottom-row">
      <div class="token-group">
        <label>Token d'accès personnel</label>
        <div class="input-wrap">
          <lucide-angular class="input-icon" [img]="KeyIcon" [size]="16"></lucide-angular>
          <input
            type="password"
            placeholder="ghp_xxxxxxxxxxxx"
            [(ngModel)]="form.token"
            name="token"
          />
        </div>
        <small>Optionnel. Requis pour les dépôts privés. Jamais stocké.</small>
      </div>

      <div class="actions">
        <button class="fetch-btn" (click)="onFetchCommits()">
          <lucide-angular [img]="GithubIcon" [size]="16"></lucide-angular>
          <span>Récupérer les commits</span>
        </button>
      </div>
    </div>
  </div>
</div>
