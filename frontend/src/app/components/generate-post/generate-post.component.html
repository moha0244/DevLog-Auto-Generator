<div class="generate-post">
  <div class="generate-header">
    <div class="header-left">
      <div class="icon-box">
        <lucide-angular [img]="SparklesIcon" [size]="16"></lucide-angular>
      </div>
      <span>Générer un post</span>
    </div>
  </div>

  <div class="generate-body">
    <div class="generate-row">
      <div class="generate-field">
        <label>Ton</label>
        <select [(ngModel)]="tone">
          <option>Professionnel</option>
          <option>Décontracté</option>
          <option>Technique</option>
          <option>Familier</option>
        </select>
      </div>

      <div class="generate-field">
        <label>Plateforme</label>
        <select [(ngModel)]="platform">
          <option>LinkedIn</option>
          <option>X</option>
        </select>
      </div>

      <div class="generate-actions">
        <button type="button" [disabled]="!effectiveCommitCount" (click)="onGenerate()">
          <lucide-angular [img]="SparklesIcon" [size]="16"></lucide-angular>
          Générer à partir de {{ effectiveCommitCount }} {{ effectiveCommitCount === 1 ? 'commit' : 'commits' }}
        </button>
      </div>
    </div>
  </div>
</div>
