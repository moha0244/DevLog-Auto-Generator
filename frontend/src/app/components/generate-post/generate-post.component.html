<div class="generate-post">
  <div class="generate-header">
    <div class="header-left">
      <div class="icon-box">
        <lucide-angular [img]="SparklesIcon" [size]="16"></lucide-angular>
      </div>
      <span>Generate Post</span>
    </div>
  </div>

  <div class="generate-body">
    <div class="generate-row">
      <div class="generate-field">
        <label>Tone</label>
        <select [(ngModel)]="tone">
          <option>Professional</option>
          <option>Casual</option>
          <option>Technical</option>
          <option>decontracted</option>
        </select>
      </div>

      <div class="generate-field">
        <label>Platform</label>
        <select [(ngModel)]="platform">
          <option>LinkedIn</option>
          <option>X</option>
        </select>
      </div>

      <div class="generate-actions">
        <button type="button" [disabled]="!effectiveCommitCount" (click)="onGenerate()">
          <lucide-angular [img]="SparklesIcon" [size]="16"></lucide-angular>
          Generate from {{ effectiveCommitCount }} {{ effectiveCommitCount === 1 ? 'commit' : 'commits' }}
        </button>
      </div>
    </div>
  </div>
</div>
